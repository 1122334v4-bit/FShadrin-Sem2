name: Local CI/CD

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .pip-cache
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Установка зависимостей
        run: pip install --cache-dir .pip-cache -r requirements.txt
      - name: Сборка приложения
        run: |
          python -m compileall app
          mkdir -p dist
          cp -r app dist/
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: build
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .pip-cache
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Установка зависимостей
        run: pip install --cache-dir .pip-cache -r requirements.txt
      - name: Модульные тесты
        run: python -m pytest -v --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results.xml

  sast:
    runs-on: ubuntu-latest
    needs: test
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .pip-cache
          key: pip-semgrep-v1
      - name: Установка Semgrep
        run: pip install --cache-dir .pip-cache semgrep
      - name: Сканирование Semgrep
        run: semgrep scan --config p/python --error --severity ERROR app/

  deploy:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Docker-образа
        run: docker build -t filemanager:latest .
      - name: Локальный запуск
        run: docker run --rm filemanager:latest
      - name: Сохранение образа как артефакта
        run: docker save filemanager:latest -o filemanager.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: filemanager.tar