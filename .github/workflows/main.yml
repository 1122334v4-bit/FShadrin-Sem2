name: Local CI/CD

on:
  push:
  workflow_dispatch:

env:
  PY_IMAGE: python:3.12-slim

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .pip-cache
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Сборка приложения в контейнере
        run: |
          mkdir -p .pip-cache dist
          docker create --name job-build -w /work $PY_IMAGE sh -c "pip install --cache-dir .pip-cache -r requirements.txt && python -m compileall app && mkdir -p dist && cp -r app dist/"
          docker cp . job-build:/work
          docker start -a job-build
          docker cp job-build:/work/dist ./dist-out
          docker cp job-build:/work/.pip-cache/. ./.pip-cache
          docker rm job-build
          rm -rf dist && mv dist-out dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .pip-cache
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Модульные тесты в контейнере
        run: |
          mkdir -p .pip-cache
          docker create --name job-test -w /work $PY_IMAGE sh -c "pip install --cache-dir .pip-cache -r requirements.txt && python -m pytest -v --junitxml=test-results.xml"
          docker cp . job-test:/work
          docker start -a job-test || RC=$?
          docker cp job-test:/work/test-results.xml ./test-results.xml || true
          docker cp job-test:/work/.pip-cache/. ./.pip-cache || true
          docker rm job-test
          exit ${RC:-0}
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results.xml

  sast:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .pip-cache
          key: pip-semgrep-v1
      - name: Сканирование Semgrep в контейнере
        run: |
          mkdir -p .pip-cache
          docker create --name job-sast -w /work $PY_IMAGE sh -c "pip install --cache-dir .pip-cache semgrep && semgrep scan --config p/python --error --severity ERROR app/"
          docker cp . job-sast:/work
          docker start -a job-sast || RC=$?
          docker cp job-sast:/work/.pip-cache/. ./.pip-cache || true
          docker rm job-sast
          exit ${RC:-0}

  deploy:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Docker-образа
        run: docker build -t filemanager:latest .
      - name: Локальный запуск
        run: docker run --rm filemanager:latest
      - name: Сохранение образа как артефакта
        run: docker save filemanager:latest -o filemanager.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: filemanager.tar